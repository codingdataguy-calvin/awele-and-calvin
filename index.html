<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awele &amp; Calvin</title>
<meta name="description" content="You're invited to celebrate the marriage of Awele and Calvin in Lagos, 21 and 22 December 2026.">
<meta property="og:title" content="Awele &amp; Calvin are getting married">
<meta property="og:description" content="21.12.2026 and 22.12.2026, Lagos, Nigeria">
<meta property="og:image" content="images/hero.jpg">
<meta name="theme-color" content="#7A2232">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF6EF;
    --paper: #F4ECE1;
    --card: #FEFBF7;
    --ink: #3B2A22;
    --muted: #7E6A5F;
    --burgundy: #7A2232;
    --burgundy-deep: #5C1826;
    --rose: #C98A94;
    --gold: #B8935A;
    --border: #DCCBB8;
    --overlay: rgba(30, 20, 14, .46);
    --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    --script: "Parisienne", "Cormorant Garamond", cursive;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
    --tooth: 34px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-weight: 300; font-size: 1rem; line-height: 1.65;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--burgundy); outline-offset: 3px; }

  /* ---------- Shared pieces ---------- */
  .eyebrow { margin: 0 0 .8rem; font-size: .68rem; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: var(--burgundy); }
  .divider { display: flex; align-items: center; gap: .75rem; width: 7rem; margin: 1.25rem auto 0; color: var(--burgundy); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .45; }
  .divider svg { width: 12px; height: 12px; fill: currentColor; }
  .on-photo .divider { color: #FFF6EE; }
  .paper { background: var(--paper); }
  .block { padding: 6rem 1.25rem; }
  .wrap { max-width: 64rem; margin: 0 auto; }
  .head { text-align: center; margin-bottom: 3rem; }
  .head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.8rem, 9vw, 3.8rem); line-height: 1; margin: 0; }
  .lead { max-width: 36rem; margin: 0 auto; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.6; }
  .lead + .lead { margin-top: 1rem; }

  /* Zigzag paper edge between photo and paper */
  .teeth { position: absolute; left: 0; right: 0; height: calc(var(--tooth) / 2); z-index: 3; background-repeat: repeat-x; background-size: var(--tooth) var(--tooth); }
  .teeth.down { bottom: -1px;
    background-image: linear-gradient(-45deg, var(--paper) calc(var(--tooth) / 2 - .5px), transparent calc(var(--tooth) / 2)),
                      linear-gradient(45deg, var(--paper) calc(var(--tooth) / 2 - .5px), transparent calc(var(--tooth) / 2));
    background-position: left bottom; }
  .teeth.up { top: -1px;
    background-image: linear-gradient(-135deg, var(--bg) calc(var(--tooth) / 2 - .5px), transparent calc(var(--tooth) / 2)),
                      linear-gradient(135deg, var(--bg) calc(var(--tooth) / 2 - .5px), transparent calc(var(--tooth) / 2));
    background-position: left top; }

  /* ---------- Photo sections (hero + footer) ---------- */
  .photo-sec { position: relative; overflow: hidden; color: #FFF8F1; text-align: center; background: #2a1d17; }
  .photo-sec .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-sec .bg-blur, .photo-sec .bg-contain { display: none; }
  .photo-sec .shade { position: absolute; inset: 0; background: var(--overlay); }
  .photo-sec .content { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 3rem 1.25rem 4.5rem; }

  .hero, .hero .content { min-height: 100vh; min-height: 100svh; }
  .photo-sec.hero .bg { display: none !important; }
  .photo-sec.hero .bg-blur { display: block !important; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(26px) grayscale(.35) sepia(.25); transform: scale(1.15); }
  .photo-sec.hero .bg-contain {
    display: block !important; position: absolute; inset: 0; margin: auto;
    width: min(100%, calc(100vh * .75)); width: min(100%, calc(100svh * .75)); height: auto; aspect-ratio: 3 / 4; object-fit: cover;
    filter: grayscale(.35) sepia(.25) contrast(.95);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(180deg, transparent 0, #000 14%, #000 86%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(180deg, transparent 0, #000 14%, #000 86%, transparent 100%);
    mask-composite: intersect;
  }
  .hero .shade { background:
      radial-gradient(120% 80% at 50% 50%, rgba(92, 24, 38, .5) 0%, rgba(58, 20, 26, .72) 70%, rgba(40, 14, 18, .82) 100%); }
  .hero .content { align-items: center; padding: 4rem 1.25rem 4.5rem; }
  .hero .eyebrow { color: #FFF8F1; }
  .hero h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(3.5rem, 15vw, 7rem); line-height: .85; }
  .hero h1 .amp { display: block; padding: .45rem 0; font-family: var(--script); font-weight: 400; font-size: .5em; }
  .hero .rule { width: 6rem; height: 1px; margin: 1.25rem auto; background: rgba(255, 248, 241, .65); }
  .hero .tagline { max-width: 30rem; margin: 0 auto; font-family: var(--serif); font-size: 1.3rem; line-height: 1.5; }
  .hero .dates { display: grid; grid-template-columns: 1fr 1fr; max-width: 24rem; margin: 1.5rem auto 0; border-block: 1px solid rgba(255, 248, 241, .38); }
  .hero .dates div { padding: .9rem .5rem; }
  .hero .dates div + div { border-left: 1px solid rgba(255, 248, 241, .38); }
  .hero .dates b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.7rem; letter-spacing: .02em; line-height: 1.2; }
  .hero .dates span { display: block; margin-top: .2rem; font-size: .56rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; }
  .hero .place { margin: 1.1rem 0 0; font-size: .68rem; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; }

  .footer, .footer .content { min-height: 70vh; min-height: 70svh; }
  .footer .bg { object-position: 50% 45%; }
  .footer .eyebrow { color: #FFF8F1; }
  .footer .names { margin: 0; font-family: var(--script); font-size: clamp(3.4rem, 15vw, 6rem); line-height: 1.15; }

  @media (min-width: 1024px) {
    .photo-sec .bg { display: none; }
    .photo-sec .bg-blur { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(28px); transform: scale(1.12); }
    .photo-sec .bg-contain { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  }


  /* ---------- Notes ---------- */
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .note {
    position: relative; overflow: hidden; isolation: isolate; margin: 0;
    display: flex; flex-direction: column; justify-content: space-between; gap: 1rem;
    min-height: 15rem; padding: 1.75rem 1.6rem 1.5rem;
    background: var(--card); border-radius: 4px; box-shadow: inset 0 0 0 1px var(--border);
  }
  .note::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background-image: var(--img); background-size: cover; background-position: var(--pos, center);
    opacity: .3; filter: grayscale(.8) sepia(.3);
  }
  .note::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(254,251,247,.7), rgba(254,251,247,.25) 55%, rgba(254,251,247,.6)); }
  .note .msg { font-family: var(--serif); font-size: 1.35rem; line-height: 1.4; margin: 0; }
  .verse { margin: 1rem 0 0; padding-left: .9rem; border-left: 2px solid var(--gold); }
  .verse p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.08rem; line-height: 1.45; }
  .verse u { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .verse cite { display: block; margin-top: .35rem; font-style: normal; font-size: .62rem; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .note .from { font-family: var(--script); font-size: 1.6rem; color: var(--burgundy); line-height: 1; margin: 0; }

  .note.story { grid-column: 1 / -1; background: var(--burgundy); color: #FFF6EE; box-shadow: none; padding: clamp(2rem, 6vw, 3.25rem) clamp(1.5rem, 6vw, 3.5rem); }
  .note.story::before { opacity: .28; filter: grayscale(1); mix-blend-mode: luminosity; }
  .note.story::after { background: linear-gradient(180deg, rgba(122,34,50,.55), rgba(122,34,50,.2) 50%, rgba(122,34,50,.55)); }
  .note.story .words { max-width: 38rem; }
  .note.story p { font-family: var(--serif); font-size: 1.25rem; line-height: 1.6; margin: 0 0 1rem; }
  .note.story p.big { font-family: var(--script); font-size: 2.2rem; line-height: 1.2; color: #F3D9B0; margin: .2rem 0 1rem; }
  .note.story .from { color: #F3D9B0; }

  /* ---------- Details ---------- */
  .details { border-top: 1px solid var(--border); }
  .event { max-width: 38rem; margin: 0 auto; padding: 3rem 1rem; text-align: center; border-bottom: 1px solid var(--border); }
  .event svg.icon { width: 46px; height: 46px; margin: 0 auto 1rem; }
  .event .when { margin: 0 0 .6rem; font-size: .64rem; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--burgundy); }
  .event h3 { margin: 0 0 .75rem; font-family: var(--serif); font-weight: 500; font-size: 2.1rem; line-height: 1.1; }
  .event .venue { margin: 0; font-weight: 500; }
  .event .addr { margin: .25rem 0 0; font-size: .92rem; color: var(--muted); }
  .link { display: inline-flex; align-items: center; gap: .4rem; margin-top: 1.25rem; padding-bottom: .2rem; border-bottom: 1px solid var(--burgundy); color: var(--burgundy); text-decoration: none; font-size: .7rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
  .link svg { width: 12px; height: 12px; }
  .dress { margin: 2rem auto 0; max-width: 26rem; }
  .dress .label, .order .label { display: block; margin-bottom: .35rem; font-size: .62rem; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .dress p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.2rem; }
  .order { margin: 2rem auto 0; max-width: 22rem; }
  .order ol { list-style: none; margin: .5rem 0 0; padding: 0; }
  .order li { display: grid; grid-template-columns: 5.5rem 1fr; gap: .75rem; align-items: baseline; padding: .55rem 0; border-top: 1px dashed var(--border); text-align: left; }
  .order li:last-child { border-bottom: 1px dashed var(--border); }
  .order time { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; color: var(--burgundy); text-align: right; }

  /* ---------- Gallery ---------- */
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .gallery button {
    position: relative; overflow: hidden; aspect-ratio: 4 / 5; width: 100%; padding: 0; border: 0; cursor: zoom-in;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--border); border-radius: 2px;
  }
  .gallery button.wide { grid-column: span 2; }
  .gallery img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s cubic-bezier(.2,.7,.2,1); }
  .gallery button::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(40,25,18,.45), transparent 60%); opacity: 0; transition: opacity .5s ease; }
  .gallery button:hover img { transform: scale(1.05); }
  .gallery button:hover::after { opacity: 1; }
  .gallery-note { margin: 1.5rem 0 0; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--muted); }
  @media (min-width: 900px) {
    .gallery { grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .gallery button.wide { grid-column: span 2; grid-row: span 2; }
  }

  .lightbox { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(30, 18, 12, .94); padding: 3.5rem .75rem 5.5rem; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-btn { position: absolute; width: 46px; height: 46px; border: 1px solid rgba(255,248,241,.5); border-radius: 50%; background: transparent; color: #FFF8F1; font-size: 1.4rem; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .lb-close { top: 1rem; right: 1rem; }
  .lb-prev, .lb-next { bottom: 1.25rem; }
  .lb-prev { left: calc(50% - 58px); }
  .lb-next { right: calc(50% - 58px); }
  .lb-count { position: absolute; top: 1.4rem; left: 1.25rem; color: #FFF8F1; font-size: .7rem; letter-spacing: .24em; }
  @media (min-width: 900px) {
    .lb-prev, .lb-next { bottom: auto; top: 50%; transform: translateY(-50%); }
    .lb-prev { left: 1.25rem; } .lb-next { right: 1.25rem; }
  }

  /* ---------- Enquiry ---------- */
  .enquiry { text-align: center; padding: 6rem 1.25rem 7rem; }
  .enquiry .icon { width: 30px; height: 30px; margin: 0 auto 1.25rem; color: var(--burgundy); }
  .enquiry h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.4rem, 8vw, 3.2rem); line-height: 1.05; margin: 0; }
  .enquiry p { max-width: 28rem; margin: 1.25rem auto 0; color: var(--muted); }
  .wa-list { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
  .wa { display: inline-flex; align-items: center; justify-content: center; gap: .6rem; min-width: 15rem; padding: .95rem 1.4rem; border: 1px solid var(--burgundy); color: var(--burgundy); text-decoration: none; font-size: .9rem; font-weight: 400; letter-spacing: .04em; transition: background .25s ease, color .25s ease; }
  .wa:hover { background: var(--burgundy); color: #FFF8F1; }
  .wa svg { width: 18px; height: 18px; flex: none; }

  @media (max-width: 640px) {
    .block { padding: 4.5rem 1.1rem; }
    .head { margin-bottom: 2.25rem; }
    .notes { grid-template-columns: 1fr; }
    .note { min-height: 0; }
    .event { padding: 2.5rem .5rem; }
    .wa { width: 100%; }
    :root { --tooth: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .gallery img, .gallery button::after, .wa { transition: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <path id="heart" d="M12 21s-7.5-4.6-10-9.3C.4 8.6 2.2 4.5 6 4.5c2.1 0 3.4 1.2 4.2 2.4h3.6c.8-1.2 2.1-2.4 4.2-2.4 3.8 0 5.6 4.1 4 7.2C19.5 16.4 12 21 12 21z"/>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3B0"/><stop offset=".5" stop-color="#C9A35A"/><stop offset="1" stop-color="#9C7A3E"/></linearGradient>
    <linearGradient id="clayG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C4F2E"/><stop offset=".45" stop-color="#D08355"/><stop offset="1" stop-color="#8E4527"/></linearGradient>
    <symbol id="rings" viewBox="0 0 80 60">
      <circle cx="31" cy="36" r="16" fill="none" stroke="url(#goldG)" stroke-width="4.5"/>

<!-- 1. Hero: full-screen photo, dark overlay, invitation on top -->
<header class="photo-sec hero">
  <img class="bg" src="images/hero.jpg" alt="Awele and Calvin">
  <img class="bg-blur" src="images/hero.jpg" alt="" aria-hidden="true">
  <img class="bg-contain" src="images/hero.jpg" alt="" aria-hidden="true">
  <div class="shade"></div>
  <div class="content">
    <div>
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroNames"></h1>
      <div class="rule"></div>
      <p class="tagline" id="tagline"></p>
      <div class="dates" id="heroDates"></div>
      <p class="place" id="place"></p>
    </div>
  </div>
  <div class="teeth down"></div>
</header>

<main>
  <!-- 2. Welcome -->
  <section class="paper block" id="welcome">
    <div class="wrap">
      <div class="head"><h2>Welcome</h2><div class="divider"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div></div>
      <div id="welcomeText"></div>
    </div>
  </section>

  <!-- 3. Notes -->
  <section class="paper block" id="notes" style="padding-top:0">
    <div class="wrap">
      <div class="head"><h2>A few words from us</h2><div class="divider"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div></div>
      <div class="notes" id="notesGrid"></div>
    </div>
  </section>

  <!-- 4. Details -->
  <section class="paper block" id="details" style="padding-top:0">
    <div class="wrap">
      <div class="head"><p class="eyebrow">Save the dates</p><h2>The details</h2><div class="divider"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div></div>
      <div id="ceremonyText" style="margin-bottom:3rem"></div>
      <div class="details" id="events"></div>
    </div>
  </section>

  <!-- 5. Gallery -->
  <section class="paper block" id="gallery" style="padding-top:0">
    <div class="wrap">
      <div class="head"><p class="eyebrow">A little glimpse</p><h2>Gallery</h2><div class="divider"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div></div>
      <div class="gallery" id="galleryGrid"></div>
    </div>
  </section>

  <!-- 6. Enquiry -->
  <section class="enquiry" id="contact">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
    <p class="eyebrow">Any questions?</p>
    <h2 id="contactTitle"></h2>
    <p id="contactText"></p>
    <div class="wa-list" id="contactList"></div>
  </section>
</main>

<!-- 7. Footer: full photo, overlay, sign-off -->
<footer class="photo-sec footer">
  <div class="teeth up"></div>
  <img class="bg" src="images/footer.jpg" alt="Awele and Calvin holding hands" loading="lazy">
  <img class="bg-blur" src="images/footer.jpg" alt="" aria-hidden="true" loading="lazy">
  <img class="bg-contain" src="images/footer.jpg" alt="" aria-hidden="true" loading="lazy">
  <div class="shade"></div>
  <div class="content on-photo">
    <div>
      <p class="eyebrow">With love</p>
      <p class="names" id="footerNames"></p>
      <div class="divider"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div>
    </div>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <span class="lb-count" id="lbCount"></span>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">&lsaquo;</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">&rsaquo;</button>
</div>

(function () {
  const W = WEDDING;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const couple = `${W.partner1} & ${W.partner2}`;
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const waIcon = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 2.4 1 2.9.8 3.4.7.5-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm0-21.6A11.8 11.8 0 0 0 1.9 17.9L.2 24l6.3-1.6A11.8 11.8 0 1 0 12 .2z"/></svg>';

  document.title = `${couple} are getting married`;

  // Hero
  $("heroEyebrow").textContent = W.heroEyebrow;
  $("heroNames").innerHTML = `${esc(W.partner1)}<span class="amp">&amp;</span>${esc(W.partner2)}`;
  $("tagline").textContent = W.tagline;
  $("heroDates").innerHTML = W.days.map(d => `<div><b>${esc(d.date)}</b></div>`).join("");
  $("place").textContent = W.placeText;

  // Welcome
  $("welcomeText").innerHTML = W.welcome.map(p => `<p class="lead">${esc(p)}</p>`).join("");

  // Notes
  $("notesGrid").innerHTML = W.notes.map(n => {
    const src = (typeof TILE_PHOTOS !== "undefined" && TILE_PHOTOS[n.photo]) || `images/${n.photo}.jpg`;
    const style = ` style="--img:url('${esc(src)}');--pos:${esc(n.pos || "center")}"`;
    if (n.story) {
      const paras = n.text.map((t, i) => `<p${i === 1 ? ' class="big"' : ""}>${esc(t)}</p>`).join("");
      return `<figure class="note story"${style}><div class="words">${paras}</div><figcaption class="from">${esc(n.from)}</figcaption></figure>`;
    }
    let vtext = n.verse ? esc(n.verse.text) : "";
    if (n.verse && n.verse.underline) vtext = vtext.replace(esc(n.verse.underline), `<u>${esc(n.verse.underline)}</u>`);
    const verse = n.verse ? `<blockquote class="verse"><p>${vtext}</p><cite>${esc(n.verse.ref)}</cite></blockquote>` : "";
    return `<figure class="note"${style}><div><p class="msg">${esc(n.text)}</p>${verse}</div><figcaption class="from">${esc(n.from)}</figcaption></figure>`;
  }).join("");

  // Details
  $("ceremonyText").innerHTML = W.ceremony.map(p => `<p class="lead">${esc(p)}</p>`).join("");
  $("events").innerHTML = W.days.map(d => `
    <article class="event">
      <svg class="icon" aria-hidden="true"><use href="#${d.icon}"/></svg>
      <p class="when">${esc(d.label)} &middot; ${esc(d.start)}</p>
      <h3>${esc(d.title)}</h3>
      <p class="venue">${esc(d.venue)}</p>
      <p class="addr">${esc(d.address)}</p>
      <a class="link" href="${esc(d.mapUrl)}" target="_blank" rel="noopener">Get directions ${arrow}</a>
      <div class="dress"><span class="label">Dress code</span><p>${esc(d.dress)}</p></div>
      <div class="order"><span class="label">Order of the day</span>
        <ol>${d.schedule.map(s => `<li><time>${esc(s.time)}</time><span>${esc(s.item)}</span></li>`).join("")}</ol>
      </div>
    </article>`).join("");

  // Gallery + lightbox
  const pics = W.gallery.map(g => g.src);
  $("galleryGrid").innerHTML = W.gallery.map((g, i) =>
    `<button type="button" class="${g.wide ? "wide" : ""}" data-i="${i}" aria-label="View photo ${i + 1} of ${pics.length}"><img src="${esc(g.src)}" alt="${esc(couple)}, photo ${i + 1}" loading="lazy" decoding="async"></button>`
  ).join("");
  const lb = $("lightbox"), lbImg = $("lbImg");
  let cur = 0, lastFocus = null;
  const pad = (n) => String(n).padStart(2, "0");
  const show = (i) => { cur = (i + pics.length) % pics.length; lbImg.src = pics[cur]; lbImg.alt = `${couple}, photo ${cur + 1}`; $("lbCount").textContent = `${pad(cur + 1)} / ${pad(pics.length)}`; };
  const open = (i) => { lastFocus = document.activeElement; show(i); lb.classList.add("show"); document.body.style.overflow = "hidden"; $("lbClose").focus(); };
  const close = () => { lb.classList.remove("show"); document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); };
  $("galleryGrid").addEventListener("click", e => { const b = e.target.closest("button"); if (b) open(+b.dataset.i); });
  $("lbClose").onclick = close;
  $("lbPrev").onclick = () => show(cur - 1);
  $("lbNext").onclick = () => show(cur + 1);
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("show")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
  let tx = null;
  lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); tx = null; });

  // Contact
  $("contactTitle").textContent = W.contactTitle;
  $("contactText").textContent = W.contactText;
  $("contactList").innerHTML = W.contacts.map(c => {
    const digits = c.phone.replace(/\D/g, "");
    return `<a class="wa" href="https://wa.me/${digits}" target="_blank" rel="noopener" aria-label="Message ${esc(c.name || c.phone)} on WhatsApp">${waIcon}<span>${c.name ? esc(c.name) + ": " : ""}${esc(c.phone)}</span></a>`;
  }).join("");

  // Footer
  $("footerNames").textContent = couple;
})();
